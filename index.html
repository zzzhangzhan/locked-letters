<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locked letter</title>
</head>
<body>
  <canvas id="view"></canvas>

  <aside id="composer" class="panel" hidden>
    <header class="panel-head">
      <p class="eyebrow">A letter that stays shut</p>
      <h1>Locked letter</h1>
    </header>

    <label class="field">
      <span>Message</span>
      <textarea id="message" maxlength="4000" placeholder="Write something worth unfolding."></textarea>
    </label>

    <div class="field">
      <span>Paper</span>
      <div class="choices" id="papers"></div>
      <label class="upload">
        <input id="upload" type="file" accept="image/jpeg,image/png,image/webp" />
        <span id="upload-label">Upload a background</span>
      </label>
    </div>

    <div class="field">
      <span>Fold</span>
      <div class="stack" id="folds"></div>
    </div>

    <div class="actions">
      <button type="button" id="watch">Watch it fold</button>
      <button type="button" id="seal" class="primary">Seal letter</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <div id="share" class="share" hidden>
      <p>The letter is sealed. Share this link.</p>
      <div class="link-row">
        <input id="link" readonly />
        <button type="button" id="copy">Copy</button>
      </div>
      <button type="button" id="another" class="texty">Write another</button>
    </div>
  </aside>

  <p id="hint" class="hint" hidden>Drag across the letter to unfold it</p>

  <div id="missing" class="missing" hidden>
    <div class="missing-card">
      <p>This letter is not here.</p>
      <a href="/">Write one</a>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
