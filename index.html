<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locked letter</title>
</head>
<body>
  <canvas id="view"></canvas>

  <section id="composer" class="dock" hidden>
    <p class="eyebrow">A letter that stays shut</p>
    <ol class="step-nav" aria-label="Steps">
      <li id="nav-write">Write</li>
      <li id="nav-paper">Paper</li>
      <li id="nav-fold">Fold</li>
      <li id="nav-send">Send</li>
    </ol>

    <div id="step-write" class="step">
      <label class="field">
        <span>Write the letter</span>
        <textarea id="message" maxlength="4000" placeholder="Write something worth unfolding."></textarea>
      </label>
      <div class="step-actions">
        <button type="button" id="to-paper" class="primary">Choose paper</button>
      </div>
    </div>

    <div id="step-paper" class="step" hidden>
      <div class="choices" id="papers"></div>
      <div class="step-actions">
        <button type="button" id="paper-back">Back</button>
        <button type="button" id="to-fold" class="primary">Choose a fold</button>
      </div>
    </div>

    <div id="step-fold" class="step" hidden>
      <div class="fold-row" id="folds"></div>
      <div class="step-actions">
        <button type="button" id="fold-back">Back</button>
        <button type="button" id="to-send" class="primary">Review and send</button>
      </div>
    </div>

    <div id="step-send" class="step" hidden>
      <p class="send-copy">The letter is ready. Sealing plays the fold, then gives you a link.</p>
      <div class="step-actions">
        <button type="button" id="send-back">Back</button>
        <button type="button" id="seal" class="primary">Seal and send</button>
      </div>
      <div id="share" class="share" hidden>
        <p>The letter is on its way. Share this link.</p>
        <div class="link-row">
          <input id="link" readonly />
          <button type="button" id="copy">Copy</button>
        </div>
        <button type="button" id="another" class="texty">Write another</button>
      </div>
    </div>

    <p id="status" class="status" role="status"></p>
  </section>

  <p id="hint" class="hint" hidden>Drag across the letter to unfold it</p>

  <div id="missing" class="missing" hidden>
    <div class="missing-card">
      <p>This letter is not here.</p>
      <a href="/">Write one</a>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
